name: Apply loading layout

on:
  push:
    branches:
      - ui-changes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ui-changes
        uses: actions/checkout@v4
        with:
          ref: ui-changes

      - name: Update loading layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("templates/dashboard.html")
          text = path.read_text(encoding="utf-8")

          old = '''    <div\n        id="loading-screen"\n        class="loading-screen">\n\n        <video\n            id="loading-video"\n            loop\n            playsinline>\n\n            <source\n                src="{{ url_for(\n                    'static',\n                    filename='loading.mp4'\n                ) }}"\n                type="video/mp4">\n\n        </video>\n\n        <h2>Getting your attendance...</h2>\n\n        <p>\n            BunkMaster is checking the college portal.\n        </p>\n\n    </div>'''

          new = '''    <style>\n        .loading-screen {\n            display: none;\n            align-items: center;\n            gap: 56px;\n            text-align: left;\n            padding: 30px 86px;\n            min-height: 380px;\n        }\n\n        .loading-screen video {\n            flex: 0 0 427px;\n            width: 427px;\n            height: 320px;\n            max-width: 100%;\n            max-height: none;\n            margin: 0;\n            border-radius: 0;\n            object-fit: cover;\n        }\n\n        .loading-copy {\n            flex: 1;\n            min-width: 0;\n        }\n\n        .loading-copy h2 {\n            margin: 0 0 8px;\n            font-size: 24px;\n        }\n\n        .loading-copy p {\n            margin: 0;\n            color: #6b7280;\n            font-size: 16px;\n        }\n\n        @media (max-width: 800px) {\n            .loading-screen {\n                flex-direction: column;\n                gap: 20px;\n                padding: 24px;\n                text-align: center;\n            }\n\n            .loading-screen video {\n                flex-basis: auto;\n                width: 100%;\n                height: auto;\n                max-height: 320px;\n            }\n        }\n    </style>\n\n    <div\n        id="loading-screen"\n        class="loading-screen">\n\n        <video\n            id="loading-video"\n            loop\n            playsinline>\n\n            <source\n                src="{{ url_for(\n                    'static',\n                    filename='loading.mp4'\n                ) }}"\n                type="video/mp4">\n\n        </video>\n\n        <div class="loading-copy">\n            <h2>Getting your attendance...</h2>\n\n            <p>\n                BunkMaster is checking the college portal.\n            </p>\n        </div>\n\n    </div>'''

          if old not in text:
              raise SystemExit("Expected loading block not found; refusing to change dashboard")

          if 'class="loading-copy"' in text:
              raise SystemExit("Loading layout is already patched")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify dashboard
        run: |
          grep -q 'class="loading-copy"' templates/dashboard.html
          grep -q 'Getting your attendance...' templates/dashboard.html
          grep -q 'onclick="showSubjectAttendance({{ loop.index0 }})"' templates/dashboard.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/dashboard.html
          git diff --cached --quiet || (git commit -m "Improve loading screen layout" && git push origin ui-changes)
