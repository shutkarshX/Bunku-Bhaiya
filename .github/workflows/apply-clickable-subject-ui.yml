name: Apply clickable subject UI

on:
  push:
    branches:
      - ui-changes
    paths:
      - '.github/workflows/apply-clickable-subject-ui.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-changes

      - name: Patch dashboard
        shell: python
        run: |
          from pathlib import Path
          path = Path('templates/dashboard.html')
          text = path.read_text(encoding='utf-8')

          old = '''            {% for subject in attendance.subjects %}

                <tr>'''
          new = '''            {% for subject in attendance.subjects %}

                <tr
                    class="subject-attendance-row"
                    data-subject-index="{{ loop.index0 }}"
                    onclick="showSubjectAttendance({{ loop.index0 }})"
                    style="cursor:pointer;"
                >'''
          if old not in text:
              raise SystemExit('subject row marker not found')
          text = text.replace(old, new, 1)

          start_marker = '''<!-- ================================= -->
<!-- ================================= -->
<!-- PORTAL ATTENDANCE DETAILS -->
<!-- ================================= -->'''
          end_marker = '<!-- JAVASCRIPT -->'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('details markers not found')

          replacement = '''<!-- ================================= -->
<!-- ================================= -->
<!-- PORTAL ATTENDANCE DETAILS -->
<!-- ================================= -->

{% if attendance.subject_details %}
<div id="subject-attendance-details" style="display:none; margin-top:32px;">
    {% for detail in attendance.subject_details %}
    <div class="subject-detail-panel" data-subject-detail="{{ loop.index0 }}" style="display:none;">
        <div class="summary" style="margin-bottom:16px;">
            <h2>Attendance Details of {{ detail.subject_name }}</h2>
        </div>
        {% if detail.records %}
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Sr. No.</th>
                        <th>Date</th>
                        <th>Lecture Time</th>
                        <th>Session</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                {% for record in detail.records %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ record.get("Date", "") }}</td>
                        <td>{{ record.get("stime", "") }} - {{ record.get("etime", "") }}</td>
                        <td>{{ record.get("sessionNo", "") }}</td>
                        <td>{{ record.get("presenty", "") }}</td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <p>No attendance details were returned for this subject.</p>
        {% endif %}
    </div>
    {% endfor %}
</div>
{% endif %}

'''
          text = text[:start] + replacement + text[end:]

          helper = '''<script>
function showSubjectAttendance(index) {
    const container = document.getElementById("subject-attendance-details");
    if (!container) return;
    const panels = container.querySelectorAll("[data-subject-detail]");
    let selectedPanel = null;
    panels.forEach(function(panel) {
        const selected = panel.dataset.subjectDetail === String(index);
        panel.style.display = selected ? "block" : "none";
        if (selected) selectedPanel = panel;
    });
    if (!selectedPanel) {
        container.style.display = "none";
        return;
    }
    container.style.display = "block";
    container.scrollIntoView({ behavior: "smooth", block: "start" });
}
</script>

'''
          if 'function showSubjectAttendance(index)' not in text:
              text = text.replace(end_marker, helper + end_marker, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit dashboard patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/dashboard.html
          git diff --cached --quiet || (git commit -m "Make subject attendance rows clickable" && git push origin ui-changes)
